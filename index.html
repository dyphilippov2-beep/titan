<style>
/* Layout: phone app shell — ice-white rink surface, navy boards, red goal-line accent; sticky header, bottom tab bar */
/* Brand look (single dark theme): arena-night violet, logo yellow, jersey black, ice white */
:root{
  --bg:#130827; --surface:#1e1040; --ink:#ffffff; --muted:#b8a6e0; --line:#35206b;
  --navy:#6d36d9; --navy-ink:#ffffff; --red:#f5c71a; --blue:#c9a8ff; --soft:#2a1858;
  --gold:#f5c71a; --gold-ink:#111111; --black:#0d0d10; --alarm:#ff4f6e;
  --ok:#5fe0a0; --ok-bg:#123a2c; --warn:#ffcf5a; --warn-bg:#3b2d10; --bad-bg:#4a1530;
  --f-display:"Rubik","Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:#fff;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;border-bottom:3px solid var(--gold);
 background:linear-gradient(115deg,transparent 0 74%,rgba(245,199,26,.9) 74% 76.5%,transparent 76.5% 79%,rgba(255,255,255,.85) 79% 80%,transparent 80%),radial-gradient(120% 140% at 85% 0%,#7a3df0 0%,#3a1784 45%,#170a33 100%)}
header.top::after{content:"";position:absolute;right:-30px;bottom:-60px;width:180px;height:110px;background:repeating-linear-gradient(115deg,rgba(245,199,26,.35) 0 4px,transparent 4px 14px);transform:rotate(-8deg)}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.mark{width:60px;height:60px;border-radius:50%;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.brand b{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.02em;display:block;line-height:1;text-shadow:2px 2px 0 #000}
.brand small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.who select{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 8px;font-size:13px}
.who select option{color:#000;background:#fff}
.who .scope{font-size:12px;opacity:.85}

main{padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:22px;text-transform:uppercase;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance;text-shadow:2px 2px 0 var(--navy)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 -4px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row>.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.list>.item:first-child{border-top:0;padding-top:2px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--navy);color:var(--navy-ink);font-weight:600;font-size:14px}
.btn.red{background:var(--gold);color:var(--gold-ink);text-transform:uppercase;letter-spacing:.03em;font-weight:800}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.block{width:100%}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--alarm)}
.pill.ice{background:var(--soft);color:var(--blue)}

.kid{display:flex;gap:14px;align-items:center}
.jersey{width:58px;height:64px;color:#fff;flex:none;background:var(--black);border:1px solid #2b2b33;font-style:italic;color:#fff;border-radius:12px 12px 16px 16px;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;position:relative}
.jersey::before{content:"";position:absolute;left:0;right:0;top:40px;height:9px;background:linear-gradient(var(--gold) 0 3px,#fff 3px 6px,var(--gold) 6px)}
.kid .name{font-weight:700;font-size:17px;line-height:1.2}

.debt{border-left:5px solid var(--alarm)}
.debt.clear{border-left-color:var(--ok)}
.big{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}

.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px}
.promo{flex:0 0 78%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.promo::after{content:"";position:absolute;right:-30px;bottom:-20px;width:120px;height:60px;background:repeating-linear-gradient(115deg,rgba(245,199,26,.4) 0 3px,transparent 3px 11px);transform:rotate(-8deg)}

.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

.day{display:flex;gap:12px}
.day .date{flex:none;width:44px;text-align:center;padding-top:2px}
.day .date b{display:block;font-family:var(--f-display);font-style:italic;font-size:20px;font-weight:900}
.day .date span{font-size:12px;color:var(--muted)}
.day.today .date b{color:var(--gold)}
.day .ev{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ev-i{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--soft);min-width:0}
.ev-i .time{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.ev-i .grow{flex:1;min-width:0}

.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.att div{border-radius:8px;padding:6px 4px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;background:var(--soft)}
.att div b{display:block;font-size:14px}
.att .p{background:var(--ok-bg);color:var(--ok)}
.att .m{background:var(--bad-bg);color:var(--alarm)}
.att .s{background:var(--warn-bg);color:var(--warn)}
.markbtn{min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;font-weight:700}
.markbtn.p{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.markbtn.m{background:var(--bad-bg);color:var(--alarm);border-color:transparent}
.markbtn.s{background:var(--warn-bg);color:var(--warn);border-color:transparent}

.thumb{aspect-ratio:16/9;max-width:100%;border-radius:10px;position:relative;overflow:hidden;background:radial-gradient(90% 120% at 70% 20%,#6d36d9,#22104d 70%);display:grid;place-items:center}
.thumb::before{content:"";position:absolute;left:-10%;right:-10%;top:58%;height:14px;background:linear-gradient(var(--gold) 0 5px,transparent 5px 8px,#fff 8px);transform:rotate(-12deg);opacity:.75}
.thumb::after{content:"";position:absolute;width:46%;aspect-ratio:1;border:3px solid #fff;border-radius:50%;opacity:.15}
.play{width:52px;height:52px;border-radius:50%;background:var(--gold);display:grid;place-items:center;z-index:1}
.play::before{content:"";border-left:15px solid #111;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:2px 6px;border-radius:6px;z-index:1}
.thumb .cat{position:absolute;left:8px;top:8px;z-index:1}
video{width:100%;border-radius:10px;background:#000}
ol.tips,ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}

.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding-block:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=tel],select.in,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.composer input{flex:1;min-width:0}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--alarm);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.doc{width:34px;height:40px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--blue);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--gold-ink);font-weight:600;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.back{border:0;background:none;color:var(--blue);font-weight:600;padding:0;align-self:flex-start}
.note{font-size:12px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--black);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--gold)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px;padding:0 4px}
@media (prefers-reduced-motion:no-preference){.card,.promo{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}}}
</style>

<script>
/* ===================== ВРЕМЯ ===================== */
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOWFULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MON_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1);
const TODAY_D=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const TODAY=fmt(TODAY_D);
const TIDX=(TODAY_D.getDay()+6)%7;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const MONDAY=addDays(TODAY_D,-TIDX);
const WEEK=DOW.map((w,i)=>[w,fmt(addDays(MONDAY,i))]);
const now=()=>TODAY+' '+new Date().toTimeString().slice(0,5);
const pd=s=>{const [d,m,y]=String(s).split('.').map(Number);return new Date(y,m-1,d)};
const daysLeft=s=>Math.round((pd(s)-TODAY_D)/864e5);
const toISO=s=>{if(!s)return '';const [d,m,y]=s.split('.');return y&&m&&d?`${y}-${m}-${d}`:''};
const fromISO=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${d}.${m}.${y}`};
const byOf=g=>{const m=String(g).match(/^(\d{4})/);return m?m[1]:''};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let DB=null;const LASTJ={},LASTO={},CHN={},READY=new Set();
const NS='_v3';
const COLL={kids:()=>KIDS,events:()=>EVENTS,slots:()=>SLOTS,posts:()=>POSTS,tours:()=>TOURS,videos:()=>VIDEOS,msgs:()=>MSGS,notifs:()=>NOTIFS,payreq:()=>PAYREQ};
const SETC={kids:v=>KIDS=v,events:v=>EVENTS=v,slots:v=>SLOTS=v,posts:v=>POSTS=v,tours:v=>TOURS=v,videos:v=>VIDEOS=v,msgs:v=>MSGS=v,notifs:v=>NOTIFS=v,payreq:v=>PAYREQ=v};
const SORT={kids:(a,b)=>String(a.name).localeCompare(String(b.name),'ru'),events:(a,b)=>a.d-b.d||String(a.s).localeCompare(String(b.s)),
  slots:(a,b)=>a.d-b.d||String(a.t).localeCompare(String(b.t)),posts:(a,b)=>(b.ts||0)-(a.ts||0),tours:(a,b)=>(a.ts||0)-(b.ts||0),
  videos:(a,b)=>(a.ts||0)-(b.ts||0),msgs:(a,b)=>(a.ts||0)-(b.ts||0),notifs:(a,b)=>(b.ts||0)-(a.ts||0),payreq:(a,b)=>(a.ts||0)-(b.ts||0)};
const ALLC=[...Object.keys(COLL),'meta'];
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(isObj(v))return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
function diff(a,b){const out={};let any=false;new Set([...Object.keys(a||{}),...Object.keys(b||{})]).forEach(k=>{
  const x=a?a[k]:undefined,y=b?b[k]:undefined;if(stable(x)===stable(y))return;
  if(isObj(x)&&isObj(y)){const d=diff(x,y);if(d){out[k]=d;any=true}}else{out[k]=y===undefined?null:y;any=true}});return any?out:null}
function entities(){const m={};for(const c in COLL)COLL[c]().forEach(x=>m[c+NS+'/'+x.id]=x);for(const k in META)m['meta'+NS+'/'+k]=META[k];return m}
function onWriteErr(e){
  if(e&&e.code==='invalid_argument'){if(!S.readonly){S.readonly=true;toast('Изменения не сохраняются: у вас доступ только для просмотра. Попросите владельца пригласить вас с правом редактирования');render()}}
  else if(e&&e.code==='quota_exceeded'){toast('Общая база заполнена, изменение не сохранилось');render()}
  else if(e&&e.code==='resource_exhausted'){toast('Слишком много изменений подряд. Подождите пару секунд');render()}}
function queue(p,fn){CHN[p]=(CHN[p]||Promise.resolve()).then(fn).catch(onWriteErr)}
function syncOut(){if(!DB||S.loading)return;const m=entities();
  for(const p in m){const j=stable(m[p]);if(LASTJ[p]===j)continue;const body=JSON.parse(j),prev=LASTO[p];LASTJ[p]=j;LASTO[p]=body;
    if(prev){const d=diff(prev,body);if(!d)continue;queue(p,()=>DB.doc(p).update(d).catch(e=>{if(e&&e.code==='invalid_argument')return DB.doc(p).set(body);throw e}))}
    else queue(p,()=>DB.doc(p).set(body))}
  for(const p in LASTJ)if(!(p in m)){delete LASTJ[p];delete LASTO[p];queue(p,()=>DB.doc(p).delete())}}
function applySnap(c,snap){
  const docs=snap.docs.filter(d=>d.exists).map(d=>[c+NS+'/'+d.id,JSON.parse(JSON.stringify(d.data()))]);
  if(c==='meta'){docs.forEach(([p,v])=>{META[p.split('/')[1]]=v;LASTJ[p]=stable(v);LASTO[p]=JSON.parse(LASTJ[p])})}
  else{Object.keys(LASTJ).forEach(p=>{if(p.startsWith(c+NS+'/')){delete LASTJ[p];delete LASTO[p]}});
    docs.forEach(([p,v])=>{LASTJ[p]=stable(v);LASTO[p]=JSON.parse(LASTJ[p])});SETC[c](docs.map(([,v])=>v).sort(SORT[c]))}
  READY.add(c);if(READY.size===ALLC.length&&S.loading){S.loading=false;fixMe();render();syncOut();return}
  if(!S.loading){fixMe();renderKeep()}}
function renderKeep(){
  const a=document.activeElement,fid=a&&a.id,vals={};
  document.querySelectorAll('#main input[id],#main textarea[id],#main select[id],.sheet input[id],.sheet textarea[id]').forEach(e=>{if(e.type!=='file'&&e.type!=='checkbox')vals[e.id]=e.value});
  const y=MAIN().scrollTop;render();
  for(const k in vals){const e=document.getElementById(k);if(e&&e.type!=='file')e.value=vals[k]}
  if(fid){const e=document.getElementById(fid);if(e&&e!==document.body)e.focus()}scrollMain(y)}

/* ===================== ФАЙЛЫ ===================== */
async function readUpload(file){
  if(file.type.startsWith('image/')){
    const url=URL.createObjectURL(file);const img=new Image();
    await new Promise((ok,bad)=>{img.onload=ok;img.onerror=()=>bad('Не получилось открыть картинку');img.src=url});
    let w=img.naturalWidth,h=img.naturalHeight;const max=1600;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
    const cv=document.createElement('canvas');let data='';
    for(let scale=1;scale>.3;scale-=.15){cv.width=Math.round(w*scale);cv.height=Math.round(h*scale);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      for(let q=.82;q>=.45;q-=.12){data=cv.toDataURL('image/jpeg',q);if(data.length<230000)break}if(data.length<230000)break}
    URL.revokeObjectURL(url);if(data.length>=230000)throw 'Картинка слишком большая даже после сжатия';
    return {name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',data}}
  if(file.size>170000)throw 'Файл больше 170 КБ. Сфотографируйте документ или сохраните его как картинку — фото сожмётся автоматически.';
  const data=await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>bad('Не получилось прочитать файл');r.readAsDataURL(file)});
  return {name:file.name,type:file.type||'application/octet-stream',data}}
async function putFile(f,kid){const id=uid('f');const doc={id,name:f.name,type:f.type,data:f.data,by:myName(),d:TODAY,kid:kid||null};
  if(DB)await DB.doc('files'+NS+'/'+id).set(doc);else{FILESLOCAL[id]=doc;saveLocal()}return id}
async function getFile(id){if(DB){const s=await DB.doc('files'+NS+'/'+id).get();return s.exists?s.data():null}return FILESLOCAL[id]||null}
async function openFile(id){S.sheet='file';S.file={id,loading:true};render();
  try{const f=await getFile(id);S.file=f?{id,name:f.name,type:f.type,data:f.data}:{id,missing:true}}catch(e){S.file={id,missing:true}}render()}
function dataToBlobUrl(data){try{const [h,b]=data.split(',');const mime=h.split(':')[1].split(';')[0];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:mime}))}catch(e){return data}}

const canWrite=th=>{if(S.role==='parent'||S.role==='owner')return true;const ch=th.split(':')[1];return ch===(S.role==='director'?'director':S.role)};
const isMine=m=>S.role==='parent'?(m.from==='parent'&&(m.name===parentLabel()||m.name===myParent().r)):m.from===S.role;

function unreadIn(th){if(!canWrite(th))return 0;const s=seen('th:'+th);return MSGS.filter(m=>m.th===th&&m.ts>s&&!isMine(m)&&(S.role==='parent'?m.from!=='parent':m.from==='parent')).length}

const attCell=a=>`<div class="${a.s==='+'?'p':a.s==='-'?'m':'s'}"><b>${a.s==='+'?'✓':a.s==='-'?'✗':'Бол.'}</b>${a.d}</div>`;

function startDraft(mode,k){const parts=String(k?k.name:'').split(' ');
  S.draft={mode,id:k?k.id:null,f:parts[0]||'',i:parts[1]||'',o:parts.slice(2).join(' '),g:k?k.g:(S.group||GROUPS()[0]),by:k?(k.by||''):byOf(S.group||GROUPS()[0]),pos:k?k.pos:POS[0],num:k?(k.num??''):'',
    parents:k?k.parents.map(c=>({...c})):[{r:'Мама',n:'',p:''},{r:'Папа',n:'',p:''}],rel:k?(k.rel||[]).map(c=>({...c})):[]}}
function readDraft(){const D=S.draft;if(!D)return;const g=id=>{const e=document.getElementById(id);return e?e.value:null};
  [['kF','f'],['kI','i'],['kO','o'],['kG','g'],['kBy','by'],['kPos','pos'],['kNum','num']].forEach(([id,f])=>{const v=g(id);if(v!==null)D[f]=v});
  D.parents.forEach((c,j)=>{const n=g('pn'+j),p=g('pp'+j);if(n!==null)c.n=n;if(p!==null)c.p=p});
  D.rel.forEach((c,j)=>{const r=g('rr'+j),n=g('rn'+j),p=g('rp'+j);if(r!==null)c.r=r;if(n!==null)c.n=n;if(p!==null)c.p=p})}
function draftForm(){const D=S.draft,staff=D.mode!=='parent';

function saveDraft(){readDraft();const D=S.draft;
  const clean=arr=>arr.map(c=>({r:String(c.r).trim()||'Доверенное лицо',n:String(c.n).trim(),p:String(c.p).trim()})).filter(c=>c.n);
  const parents=clean(D.parents),rel=clean(D.rel),name=[D.f,D.i,D.o].map(x=>String(x).trim()).filter(Boolean).join(' ');
  if(!String(D.f).trim()||!String(D.i).trim())return toast('Укажите фамилию и имя ребёнка');
  if(!parents.length)return toast('Нужен хотя бы один родитель с ФИО и телефоном');

    const kidLine=(id,n,sid)=>{const k=kidById(id);if(!k)return '';const ph=(k.parents[0]||{}).p||'';
      return `<li class="kl"><span class="kn">${n}.</span><div class="grow"><b>${esc(k.name)}</b><div class="muted">${esc(k.pos)} · группа ${esc(k.g)}${k.by&&k.by!==byOf(k.g)?' · '+esc(k.by)+' г.р.':''}${ph?` · <a href="tel:${esc(ph.replace(/[^\d+]/g,''))}" style="color:var(--blue)">${esc(ph)}</a>`:''}</div></div>${sid?`<span class="pill ${isInv(SLOTS.find(x=>x.id===sid)||{},id)?'warn':'ok'}" style="align-self:center">${isInv(SLOTS.find(x=>x.id===sid)||{},id)?'ждём ответа':'придёт'}</span><button class="btn ghost sm" data-a="unseat" data-v="${sid}|${id}" aria-label="Убрать из окна">✕</button>`:''}</li>`};

        <span class="pill ${seats.length?'ok':''}">${seats.length} ${seats.length%10===1&&seats.length%100!==11?'участник':seats.length%10>=2&&seats.length%10<=4&&(seats.length%100<10||seats.length%100>=20)?'участника':'участников'}</span></div>
        ${seats.length?`<ol class="klist">${seats.map((id,i)=>kidLine(id,i+1,s.id)).join('')}</ol>`:'<div class="muted">Пока никто не записался.</div>'}
        ${past?'':`<div class="row" style="gap:6px"><select class="in grow" id="addk_${s.id}" aria-label="Добавить хоккеиста"><option value="">Добавить хоккеиста…</option>${GROUPS().map(g=>{const ks=KIDS.filter(k=>k.g===g&&!seats.includes(k.id));return ks.length?`<optgroup label="Группа ${esc(g)}">${ks.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join('')}</optgroup>`:''}).join('')}</select><button class="btn sm" data-a="coAddKid" data-v="${s.id}">Добавить</button></div>`}
        ${S.slDel===s.id?`<div class="row" style="gap:6px;flex-wrap:wrap"><span class="danger grow">${seats.length?'Записи отменятся, родителям придёт уведомление.':'Удалить окно?'}</span><button class="btn warnb sm" data-a="slDelYes" data-v="${s.id}">Удалить</button><button class="btn ghost sm" data-a="slDelNo">Нет</button></div>`
          :`<div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-a="slDel" data-v="${s.id}">Удалить окно</button></div>`}</div>`};
    return `<div class="card"><div class="row" style="gap:16px;flex-wrap:wrap"><div class="grow"><div class="muted">Записаны ко мне на неделе</div><div class="big">${nb}</div></div><div class="grow"><div class="muted">Моих окон</div><div class="big">${my.length}</div></div></div></div>
    ${S.slEdit?slotForm():'<button class="btn ghost" data-a="slNew">Добавить своё окно</button>'}

  return `${S.slEdit?slotForm():'<button class="btn ghost" data-a="slNew">Добавить окно</button>'}
  <div class="card" style="gap:14px">${WEEK.map(([dw,dt],i)=>{const ss=SLOTS.filter(s=>s.d===i);if(!ss.length)return '';
    return `<div class="day"><div class="date"><b>${dt.slice(0,2)}</b><span>${dw}</span></div><div class="ev">${ss.map(s=>{const ks=(s.seats||[]).map(kidById).filter(Boolean);
      const del=S.slDel===s.id?`<div style="flex-basis:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="danger">${ks.length?'Записи будут отменены, родителям придёт уведомление.':'Удалить окно?'}</span><button class="btn warnb sm" data-a="slDelYes" data-v="${s.id}">Удалить</button><button class="btn ghost sm" data-a="slDelNo">Нет</button></div>`:`<button class="btn ghost sm" data-a="slDel" data-v="${s.id}" aria-label="Удалить окно">✕</button>`;
      return `<div class="ev-i" style="flex-wrap:wrap"><span class="time">${esc(s.t)}</span><div class="grow"><b>${esc(s.k)}</b><div class="muted">${slotLine(s)}</div>${ks.length?`<div class="row" style="gap:4px;flex-wrap:wrap;margin-top:4px">${ks.map(k=>`<span class="pill">${esc(short(k.name))} <button class="btn ghost sm" style="padding:0 6px;min-height:0" data-a="unseat" data-v="${s.id}|${k.id}" aria-label="Снять запись">✕</button></span>`).join('')}</div>`:''}</div><div class="row" style="gap:6px;flex-wrap:wrap;flex-basis:100%;justify-content:flex-end"><span class="pill ${nSeats(s)?'ok':''}">участников: ${nSeats(s)}</span>${S.slDel===s.id?'':del}</div>${S.slDel===s.id?del:''}</div>`}).join('')}</div></div>`}).join('')||'<div class="muted">Окон пока нет.</div>'}</div>`}

/* ===================== ЧАТ ===================== */
function chat(){
  const th=threadsFor();
  if(!S.thread){
    const pick=isStaff()&&!isTop()?`<div class="card"><label class="field">Написать семье<select class="in" id="newChat"><option value="">Выберите хоккеиста…</option>${myGroups().flatMap(g=>KIDS.filter(k=>k.g===g)).map(k=>`<option value="${k.id}">${esc(short(k.name))} · ${k.g}</option>`).join('')}</select></label></div>`
      :isTop()?`<div class="card"><label class="field">Написать семье от ${S.role==='owner'?'собственника':'руководителя'}<select class="in" id="newChat"><option value="">Выберите хоккеиста…</option>${KIDS.map(k=>`<option value="${k.id}">${esc(short(k.name))} · ${k.g}</option>`).join('')}</select></label><div class="muted">Вам видны все чаты школы. Писать можно в чатах с руководителем, остальные только для просмотра.</div></div>`:'';
    return `<h2>${S.role==='parent'?'Чат со школой':'Чаты с родителями'}</h2>${pick}
    <div class="card"><div class="list">${th.length?th.map(([key,title,sub])=>{const ms=MSGS.filter(m=>m.th===key),last=ms[ms.length-1],un=unreadIn(key);
      return `<button class="item" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%" data-a="thread" data-v="${key}"><div class="grow"><div class="t">${esc(title)}${!canWrite(key)?' <span class="pill">просмотр</span>':''}</div><div class="muted">${esc(sub)}</div>${last?`<div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(last.t)}</div>`:''}</div>${un?`<span class="badge">${un}</span>`:''}</button>`}).join(''):'<div class="muted">Пока нет переписки.</div>'}</div></div>`}
  const t=th.find(x=>x[0]===S.thread)||[S.thread,'Чат',''];const msgs=MSGS.filter(m=>m.th===S.thread);
  setTimeout(()=>{if(msgs.length)markSeen('th:'+S.thread,msgs[msgs.length-1].ts);header()},0);
  const ch=S.thread.split(':')[1];
  return `<button class="back" data-a="back">‹ Все чаты</button>
  <div><h2>${esc(t[1])}</h2><div class="muted">${esc(t[2])}</div></div>
  ${S.role==='parent'&&ch!=='director'?'<div class="note">Переписку также видит руководитель школы.</div>':''}
  <div class="bubbles">${msgs.map(m=>`<div class="bub ${isMine(m)?'me':''}">${isMine(m)?'':`<span class="who-lbl">${esc(m.from==='parent'?m.name:short(m.name)+' · '+ROLE_LBL[m.from])}</span>`}${esc(m.t)}<small>${esc(m.tm)}</small></div>`).join('')||'<div class="muted">Сообщений пока нет. Напишите первым.</div>'}</div>
  ${canWrite(S.thread)?`<form class="composer" id="sendForm"><input type="text" id="msg" placeholder="Сообщение" autocomplete="off"><button class="btn red" type="submit">Отправить</button></form>`:'<div class="ro">Только просмотр: этот чат ведёт '+(ch==='coach'?'тренер':'администратор')+'.</div>'}`}

/* ===================== СОТРУДНИКИ ===================== */
function report(){const kids=KIDS.filter(k=>visibleGroup(k.g));
  const paid=kids.reduce((a,k)=>a+(k.pays||[]).filter(x=>String(x.d).endsWith('.'+pad(TODAY_D.getMonth()+1))).reduce((b,x)=>b+x.s,0),0);
  const debt=kids.reduce((a,k)=>a+(k.debt||0),0);
  const byG=GROUPS().map(g=>{const ks=KIDS.filter(k=>k.g===g);let p=0,t=0;ks.forEach(k=>{const [a,b]=attStats(k);p+=a;t+=b});return [g,t?Math.round(p/t*100):0,ks.length]});
  const coaches=COACHES().map(c=>{const ss=SLOTS.filter(s=>s.c===c.id);return [c.name,ss.reduce((a,s)=>a+(s.seats||[]).length,0),ss.length]});
  const exp=kids.flatMap(k=>medStatus(k).filter(m=>m.left<=30).map(m=>[k,m]));
  return `<h3>Отчёт за месяц</h3>
  <div class="card"><div class="row" style="flex-wrap:wrap;gap:16px"><div class="grow"><div class="muted">Подтверждено оплат</div><div class="big">${rub(paid)}</div></div><div class="grow"><div class="muted">Долг родителей</div><div class="big" style="color:var(--alarm)">${rub(debt)}</div></div></div></div>
  <div class="card"><div class="t">Посещаемость по группам</div>${byG.map(([g,pc,n])=>`<div class="row"><span style="width:44px" class="num">${g}</span><div class="bar"><i style="width:${pc}%"></i></div><b class="num" style="width:44px;text-align:right">${n?pc+'%':'—'}</b><span class="muted" style="width:52px;text-align:right">${n} чел.</span></div>`).join('')}
  <div class="muted">Без учёта пропусков по болезни.</div></div>
  <div class="card"><div class="t">Индивидуальные на неделе: записей и окон</div>${(()=>{const mx=Math.max(1,...coaches.map(x=>x[1]));return coaches.map(([c,b,t])=>`<div class="row"><span class="grow">${esc(short(c))}</span><div class="bar"><i style="width:${Math.round(b/mx*100)}%"></i></div><b class="num">${b} чел.</b><span class="muted">${t} окон</span></div>`).join('')})()}</div>
  ${exp.length?`<div class="card alert"><div class="t">Документы истекают или не сданы</div><div class="list">${exp.map(([k,m])=>`<button class="item" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%" data-a="openKid" data-v="${k.id}"><div class="grow"><div class="t">${esc(short(k.name))} · ${k.g}</div><div class="muted">${m.n}${m.d?' до '+m.d:' не сдана'}</div></div>${m.pill}</button>`).join('')}</div></div>`:''}`}
function payReqBlock(){if(!PAYREQ.length)return '';
  return `<h3>Оплаты на проверке</h3><div class="card"><div class="list">${PAYREQ.map(p=>{const k=kidById(p.kid);return `<div class="item" style="flex-wrap:wrap"><div class="grow"><div class="t">${esc(k?short(k.name):'—')} · ${rub(p.sum)}</div><div class="muted">${esc(p.by)} · ${esc(p.d)}</div></div>
    ${p.fid?`<button class="btn ghost sm" data-a="openFile" data-v="${p.fid}">Чек</button>`:'<span class="pill">без чека</span>'}
    <div class="row" style="flex-basis:100%;gap:6px"><button class="btn red sm grow" data-a="payOk" data-v="${p.id}">Подтвердить</button><button class="btn ghost sm" data-a="payNo" data-v="${p.id}">Отклонить</button></div></div>`}).join('')}</div>
    <div class="muted">Проверьте поступление на счёт и подтвердите — долг родителя уменьшится, ему придёт уведомление.</div></div>`}
function sHome(){
  const todayEv=EVENTS.filter(e=>e.d===TIDX&&e.type!=='mass'&&visibleGroup(e.g)).sort(byTime);
  const absList=Object.entries(ABS()).filter(([,r])=>r).map(([key,r])=>{const [id,dt]=key.split('|');return [kidById(id),dt,r]}).filter(([k,dt])=>k&&visibleGroup(k.g)&&WEEK.some(w=>w[1]===dt));
  const u=unreadChats();
  const tours=TOURS.filter(t=>visibleGroup(t.g)).map(t=>{const ks=KIDS.filter(k=>k.g===t.g),ans=t.ans||{},y=ks.filter(k=>ans[k.id]==='yes'),n=ks.filter(k=>ans[k.id]==='no'),q=ks.filter(k=>!ans[k.id]);
    return `<div class="card tour"><div class="t">${esc(t.title)} · ${t.g}</div><div class="muted">${esc(t.dates)} · ответ до ${esc(t.deadline)}</div>
    <div class="row" style="gap:6px;flex-wrap:wrap"><span class="pill ok">Едут: ${y.length}</span><span class="pill">Нет: ${n.length}</span><span class="pill warn">Не ответили: ${q.length}</span></div>
    ${q.length?`<div class="muted">Не ответили: ${q.map(k=>esc(short(k.name))).join(', ')}</div><button class="btn ghost sm" data-a="remind" data-v="${t.id}">Напомнить родителям</button>`:''}</div>`}).join('');

      <button class="btn ghost sm" data-a="coDel" data-v="${i}" ${SLOTS.some(s=>s.c===c.id)||COACHES().length<2?'disabled':''}>Удалить тренера</button></div>`).join('')}
    ${COACHES().length<MAX_COACHES?`<div class="cedit"><div class="t">Новый тренер</div><input type="text" id="coNew" placeholder="ФИО"><div class="grid2"><input type="tel" id="coNewP" placeholder="Телефон"><input type="email" id="coNewE" placeholder="Электронная почта"></div><button class="btn ghost sm" data-a="coAdd">Добавить тренера</button></div>`:`<div class="note">Добавлено максимальное число тренеров: ${MAX_COACHES}.</div>`}

function copy(text,ok){const fail=()=>{S.sheet='copy';S.copyText=text;render()};
  try{navigator.clipboard.writeText(text).then(()=>{toast(ok);render()},fail)}catch(e){fail()}}
const slotTitle=s=>`${WEEK[s.d][0]}, ${WEEK[s.d][1]} в ${s.t}`;
function repriceSlot(s){const pr=curPrice(s);(s.seats||[]).forEach(id=>{const k=kidById(id);if(!k)return;const it=(k.items||[]).find(x=>x.slot===s.id);if(it&&it.s!==pr){it.s=pr;k.debt=sumItems(k)}})}
function chargeSlot(k,s){k.items.push({d:TODAY,t:`Индивидуальная, ${WEEK[s.d][0]} ${WEEK[s.d][1]} ${s.t}`,s:curPrice(s),slot:s.id,pay:'ooo'});k.debt=sumItems(k);repriceSlot(s)}
function migrateSlots(){try{SLOTS.forEach(s=>{s.seats=s.seats||[];(s.wait||[]).forEach(id=>{const k=kidById(id);if(k&&!s.seats.includes(id)){s.seats.push(id);chargeSlot(k,s)}});s.wait=[];repriceSlot(s)})}catch(e){}}
function dropSeat(s,kid,why){s.seats=(s.seats||[]).filter(x=>x!==kid);s.inv=(s.inv||[]).filter(x=>x!==kid);const k=kidById(kid);
  if(k){const i=k.items.findIndex(x=>x.slot===s.id);if(i>-1){k.items.splice(i,1);k.debt=sumItems(k)}if(why)notify({aud:'parent',kid:k.id,t:why})}repriceSlot(s)}
function fillFromWait(s){s.seats=s.seats||[];while(seatsLeft(s)>0&&(s.wait||[]).length){const nx=s.wait.shift(),nk=kidById(nx);if(!nk||s.seats.includes(nx))continue;
  s.seats.push(nx);chargeSlot(nk,s);
  notify({aud:'parent',kid:nx,t:`Освободилось место: вы записаны на индивидуальную ${slotTitle(s)}`});
  notify({aud:'staff',roles:['coach','admin'],coach:s.c,t:`${short(nk.name)} записан из листа ожидания: ${slotTitle(s)}`})}}
function closeItems(k,sum,pay){let left=sum;const its=k.items.filter(i=>payeeById(i.pay).id===payeeById(pay).id);
  for(const it of its){if(left<=0)break;if(it.s<=left){left-=it.s;k.items.splice(k.items.indexOf(it),1)}else{it.s-=left;left=0}}
  k.debt=sumItems(k)}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.self&&e.target!==b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(b.tagName==='A')return;
  switch(a){
  case 'tab':S.tab=v;S.thread=null;S.kid=null;S.draft=null;S.editSizes=false;S.editMed=false;S.evEdit=null;S.slEdit=false;S.vEdit=null;S.postType=null;S.catEdit=false;break;
  case 'notif':S.sheet='notif';break;
  case 'closeSheet':S.sheet=null;break;
  case 'seg':S.seg=v;S.evEdit=null;S.evDel=null;S.slEdit=false;break;
  case 'goInd':S.tab='sched';S.seg='ind';break;
  case 'goMed':S.tab='profile';S.editMed=true;render();document.getElementById('medH')?.scrollIntoView();return;
  case 'pick':S.sel=S.sel.includes(v)?S.sel.filter(x=>x!==v):[...S.sel,v];break;
  case 'pickClear':S.sel=[];break;
  case 'bookSel':{let n=0,sum=0;S.sel.forEach(id=>{const s=SLOTS.find(x=>x.id===id);if(!s||(s.seats||[]).includes(ME.id)||seatsLeft(s)<=0)return;
      s.seats=[...(s.seats||[]),ME.id];chargeSlot(ME,s);n++;sum+=curPrice(s);
      notify({aud:'staff',roles:['coach','admin'],coach:s.c,t:`${short(ME.name)} записан на индивидуальную ${slotTitle(s)}`})});
    S.sel=[];toast(n?`Записали на ${n} ${n===1?'тренировку':n<5?'тренировки':'тренировок'}. ${rub(sum)} добавлено к оплате`:'Эти окна уже заняли, выберите другие');break}
  case 'unbook':{const s=SLOTS.find(x=>x.id===v);if(!s)break;if(!canCancel(s)){toast('До тренировки меньше 24 часов. Отменить может только администратор');break}
    dropSeat(s,ME.id);fillFromWait(s);notify({aud:'staff',roles:['coach','admin'],coach:s.c,t:`${short(ME.name)} отменил индивидуальную ${slotTitle(s)}`});toast('Запись отменена, начисление снято');break}
  case 'wait':{const s=SLOTS.find(x=>x.id===v);if(s&&!(s.wait||[]).includes(ME.id))s.wait=[...(s.wait||[]),ME.id];if(s)notify({aud:'staff',roles:['coach','admin'],coach:s.c,t:`${short(ME.name)} в листе ожидания на индивидуальную ${slotTitle(s)}`});toast('Вы в листе ожидания. Если место освободится, мы запишем вас автоматически');break}
  case 'unwait':{const s=SLOTS.find(x=>x.id===v);if(s)s.wait=(s.wait||[]).filter(x=>x!==ME.id);break}
  case 'unseat':{const [sid,kid]=v.split('|'),s=SLOTS.find(x=>x.id===sid);if(s){dropSeat(s,kid,`Запись на индивидуальную ${slotTitle(s)} отменена ${S.role==='coach'?'тренером':'администратором'}`);fillFromWait(s)}toast('Запись отменена');break}
  case 'coAddKid':{const s=SLOTS.find(x=>x.id===v),sel=document.getElementById('addk_'+v),kid=sel&&sel.value,k=kid&&kidById(kid);

  render();syncOut()});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='role'){S.role=t.value;S.tab='home';S.thread=null;S.kid=null;S.group=null;S.draft=null;S.sel=[];S.seg='train';S.sheet=null;S.editMed=false;saveMe();render();scrollMain(0)}
  else if(t.id==='lgRole'){S.lg.role=t.value;S.lg.who=null;render()}
  else if(t.id==='lgWho'){S.lg.who=t.value}
  else if(t.id==='payPay'){S.payPay=t.value;const sm=paySums(ME)[t.value];const inp=$('#paySum');if(inp&&sm)inp.value=sm}
  else if(t.id==='dsvc'){const o=t.selectedOptions[0];if(o&&o.value!==''){$('#dsum').value=o.dataset.p;$('#dtext').value=o.dataset.n;$('#dpay').value=o.dataset.pay;$('#dkind').value='add'}}
  else if(t.id==='ident'){if(S.role==='parent'){const [k,i]=t.value.split('|');S.meKid=k;S.pidx=+i}else if(S.role==='admin')S.admin=+t.value;else S.coach=t.value;S.thread=null;S.sel=[];S.draft=null;saveMe();render()}
  else if(t.id==='newChat'&&t.value){const ch=S.role==='coach'?'coach':S.role==='admin'?'admin':'director';S.thread=t.value+':'+ch;render();scrollMain(0)}
  else if(t.id==='docfile'){const file=t.files[0];if(!file)return;const k=kidById(t.dataset.kid);
    try{toast('Загружаем…');render();const up=await readUpload(file);const fid=await putFile(up,k.id);k.docs=[...(k.docs||[]),{n:up.name,by:S.role==='parent'?parentLabel():ROLE_LBL[S.role],d:TODAY,fid}];toast('Документ загружен')}
    catch(err){toast(typeof err==='string'?err:'Не удалось загрузить файл')}render();syncOut()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
const _sheetOrig=sheet;sheet=function(){if(S.sheet==='copy')return `<div class="row"><h2 class="grow">Скопируйте вручную</h2><button class="btn ghost sm" data-a="closeSheet">Закрыть</button></div><textarea readonly style="min-height:180px">${esc(S.copyText)}</textarea><div class="muted">Выделите текст и скопируйте.</div>`;return _sheetOrig()};
fixMe();render();
(async()=>{try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db');if(!db)return;
  DB=db;S.loading=true;render();
  ALLC.forEach(c=>db.collection(c+NS).onSnapshot(s=>applySnap(c,s),()=>{toast('Связь с общей базой прервалась. Обновите страницу');render()}));
}catch(e){}})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
